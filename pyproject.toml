[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pseodo-apis"
version = "0.1.0"
description = "Lightweight pseudo business APIs that integrate with Incident Triage AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

[tool.setuptools.packages.find]
include = ["pseudo_apis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

